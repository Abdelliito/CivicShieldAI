services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: civicshield
      POSTGRES_USER: civicshield
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civicshield"]
      interval: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://civicshield:${POSTGRES_PASSWORD}@db:5432/civicshield
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      DEMO_MODE: ${DEMO_MODE:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      OPENAI_RESPONSES_URL: ${OPENAI_RESPONSES_URL:-}
      VISION_PROVIDER: ${VISION_PROVIDER:-gemini}
      VISION_MODEL: ${VISION_MODEL:-}
      VISION_ENDPOINT: ${VISION_ENDPOINT:-}
      VISION_API_KEY: ${VISION_API_KEY:-}
      VISION_FALLBACK_PROVIDER: ${VISION_FALLBACK_PROVIDER:-}
      VISION_FALLBACK_MODEL: ${VISION_FALLBACK_MODEL:-}
      VISION_FALLBACK_ENDPOINT: ${VISION_FALLBACK_ENDPOINT:-}
      VISION_FALLBACK_API_KEY: ${VISION_FALLBACK_API_KEY:-}
      VISION_TIMEOUT_SECONDS: ${VISION_TIMEOUT_SECONDS:-40}
      VISION_COMPATIBLE_JSON_MODE: ${VISION_COMPATIBLE_JSON_MODE:-false}
      VISION_ALLOW_INSECURE_HTTP: ${VISION_ALLOW_INSECURE_HTTP:-false}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      GEMINI_ENDPOINT: ${GEMINI_ENDPOINT:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      ANTHROPIC_ENDPOINT: ${ANTHROPIC_ENDPOINT:-}
      HF_TOKEN: ${HF_TOKEN:-}
      HF_MODEL: ${HF_MODEL:-}
      HF_ENDPOINT: ${HF_ENDPOINT:-}
      COMPATIBLE_API_KEY: ${COMPATIBLE_API_KEY:-}
      COMPATIBLE_MODEL: ${COMPATIBLE_MODEL:-}
      COMPATIBLE_ENDPOINT: ${COMPATIBLE_ENDPOINT:-}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
      OLLAMA_ENDPOINT: ${OLLAMA_ENDPOINT:-http://host.docker.internal:11434/api/generate}
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    depends_on:
      db: {condition: service_healthy}
    ports: ["127.0.0.1:${CIVIC_API_PORT:-8000}:8000"]
  frontend:
    build: ./frontend
    depends_on: [backend]
    ports: ["127.0.0.1:8080:80"]
volumes:
  pgdata:
  uploads:
